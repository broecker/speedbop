<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Speedbop</title>
<link rel="stylesheet" href="web/style.css">
</head>
<body>

<div id="loading">
  <div class="spinner" aria-hidden="true"></div>
  <p id="loading-status">Loading Python runtime&hellip;</p>
  <p id="loading-error" class="hidden"></p>
</div>

<!-- ============================== SETUP ============================== -->
<section id="setup-screen" class="screen hidden">
  <header class="top-bar">
    <h1>Speedbop</h1>
    <p class="subtitle">Set up your aircraft to begin</p>
  </header>
  <main>
    <form id="setup-form">
      <div class="field">
        <label for="aircraft-select">Aircraft</label>
        <select id="aircraft-select" required></select>
      </div>

      <div class="field">
        <label for="weight-input">Weight</label>
        <input id="weight-input" type="number" inputmode="decimal" step="0.1" value="17.4" required>
      </div>

      <div class="field">
        <label for="ktas-input">Starting KTAS</label>
        <input id="ktas-input" type="number" inputmode="decimal" step="1" value="485" required>
      </div>

      <div class="field">
        <label for="altitude-input">Starting altitude</label>
        <input id="altitude-input" type="number" inputmode="numeric" step="1" value="75" required>
      </div>

      <div class="bottom-action">
        <button type="submit" class="primary-btn">Start</button>
      </div>
    </form>
  </main>
</section>

<!-- ============================== TURN ============================== -->
<section id="turn-screen" class="screen hidden">
  <header class="top-bar">
    <h1 id="turn-aircraft-name">Speedbop</h1>
    <div class="state-bar">
      <div class="stat">
        <div class="value" id="stat-speed">&mdash;</div>
        <div class="label">KTAS / FP</div>
      </div>
      <div class="stat">
        <div class="value" id="stat-altitude">&mdash;</div>
        <div class="label">Altitude</div>
      </div>
      <div class="stat">
        <div class="value" id="stat-mach">&mdash;</div>
        <div class="label">Mach</div>
      </div>
    </div>
  </header>

  <main>
    <div class="field">
      <label>Pulls <span id="max-pulls-hint" class="hint">Max: &mdash;</span></label>
      <div class="stepper" data-stepper="pulls" data-min="0" data-max="40">
        <button type="button" data-step="-1" aria-label="Decrease pulls">&minus;</button>
        <output>0</output>
        <button type="button" data-step="1" aria-label="Increase pulls">&plus;</button>
      </div>
      <p id="pulls-warning" class="warning hidden"></p>
    </div>

    <div class="field">
      <label>&Delta; Altitude</label>
      <div class="stepper stepper-multi" data-stepper="delta-altitude" data-min="-50" data-max="50">
        <button type="button" data-step="-5" aria-label="Decrease altitude change by 5">&minus;5</button>
        <button type="button" data-step="-1" aria-label="Decrease altitude change by 1">&minus;1</button>
        <output>0</output>
        <button type="button" data-step="1" aria-label="Increase altitude change by 1">&plus;1</button>
        <button type="button" data-step="5" aria-label="Increase altitude change by 5">&plus;5</button>
      </div>
    </div>

    <div class="field switch-field">
      <label for="afterburner-toggle">Afterburner</label>
      <label class="switch">
        <input type="checkbox" id="afterburner-toggle">
        <span class="switch-track"></span>
      </label>
    </div>
    <p id="afterburner-caption" class="hint-line"></p>

    <details class="panel-box advanced">
      <summary>Advanced: segment FP / engine output override</summary>
      <div class="field">
        <label for="segment-fp-input">Segment FP</label>
        <input id="segment-fp-input" type="number" inputmode="numeric" step="1" placeholder="auto (current speed FP)">
      </div>
      <div class="field">
        <label for="engine-output-input">Engine output <span id="max-engine-hint" class="hint">Max: &mdash;</span></label>
        <input id="engine-output-input" type="number" inputmode="decimal" step="0.1">
      </div>
    </details>

    <details class="panel-box chart-panel" id="engine-chart-panel">
      <summary>Engine output chart</summary>
      <p id="engine-chart-caption" class="hint-line"></p>
      <div id="engine-chart"></div>
    </details>

    <div class="bottom-action">
      <button type="button" id="resolve-turn-btn" class="primary-btn">Calculate Turn Performance</button>
    </div>

    <details class="panel-box breakdown" id="breakdown-panel">
      <summary>Last turn breakdown</summary>
      <table id="breakdown-table">
        <tbody></tbody>
      </table>
    </details>

    <div class="history">
      <h2>History</h2>
      <ol id="history-list" reversed></ol>
    </div>
  </main>
</section>

<script src="https://cdn.jsdelivr.net/pyodide/v0.26.4/full/pyodide.js"></script>
<script type="module" src="web/app.js"></script>
</body>
</html>
